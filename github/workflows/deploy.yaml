name: Deploy App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file
        run: echo "MONGO_URI=${{ secrets.MONGODB_KEY }}" > .env

      - name: Install dependencies
        run: npm install

      - name: Run app
        run: node app.js